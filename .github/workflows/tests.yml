name: tests

on:
  push:
    branches: ["19.0"]
  pull_request:
    branches: ["19.0*"]

jobs:
  test:
    name: Odoo 19 unit tests
    runs-on: ubuntu-latest
    # The official odoo:19 image already has Odoo on PATH plus all of its
    # Python dependencies. We override the default entrypoint to run our
    # own commands rather than auto-starting the server.
    container:
      image: odoo:19
      options: --user root
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Install git (required for actions/checkout)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Odoo tests
        env:
          PGHOST: postgres
          PGUSER: odoo
          PGPASSWORD: odoo
        run: |
          odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,$GITHUB_WORKSPACE \
            --db_host=postgres --db_user=odoo --db_password=odoo \
            --test-enable \
            --test-tags=l10n_es_reagyp \
            --init=l10n_es_reagyp \
            --without-demo \
            --database=odoo_ci_test \
            --stop-after-init \
            --no-http \
            --log-level=info 2>&1 | tee test_output.log

          # Odoo --test-enable exits 0 even when a test fails, so we rely
          # on the result line it always logs at the end. Fail the
          # workflow if we don't see "0 failed, 0 error(s)".
          if ! grep -qE "0 failed, 0 error\(s\)" test_output.log; then
            echo "::error::Tests failed — see job log."
            exit 1
          fi
