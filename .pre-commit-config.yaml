default_language_version:
  python: python3
exclude: |
  (?x)
  ^setup/|
  /static/(src/)?lib/|
  (LICENSE.*|COPYING.*)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: /README\.rst$|\.pot?$
      - id: end-of-file-fixer
        exclude: /README\.rst$|\.pot?$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-xml
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, chore, ci, refactor, build, test]
  - repo: local
    hooks:
      - id: docs-commit-policy
        name: Docs commits carry an inventory and a why
        entry: scripts/check_docs_commit.py
        language: script
        stages: [commit-msg]
      - id: no-assistant-attribution
        name: No assistant attribution in commit messages
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
